<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dünya Radyosu</title>
<meta name="description" content="Haritada bir ülkeye dokun, oranın radyosunu dinle.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F1F4F5;
    --ocean: #E2E9ED;
    --land: #FBFCFC;
    --land-dim: #EDF1F2;
    --land-hover: #C9D9E1;
    --stroke: #CBD6DB;
    --active: #3F6C80;
    --on-active: #FFFFFF;
    --text: #1E2B33;
    --muted: #6A7B85;
    --panel: rgba(251, 252, 252, 0.82);
    --line: rgba(30, 43, 51, 0.10);
    --shadow: 0 10px 40px rgba(30, 43, 51, 0.10);
    --serif: "Instrument Serif", "Iowan Old Style", Georgia, serif;
    --sans: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  :root[data-theme="dark"] {
    --bg: #0D1418;
    --ocean: #131D23;
    --land: #23323B;
    --land-dim: #182229;
    --land-hover: #35505E;
    --stroke: #0D1418;
    --active: #86B9CC;
    --on-active: #0D1418;
    --text: #E7EEF1;
    --muted: #8A9DA7;
    --panel: rgba(19, 29, 35, 0.82);
    --line: rgba(231, 238, 241, 0.10);
    --shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.4;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    transition: background .4s ease, color .4s ease;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
  :focus-visible { outline: 2px solid var(--active); outline-offset: 3px; border-radius: 6px; }

  /* ---------- Harita ---------- */
  #stage { position: fixed; inset: 0; }
  #map { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #map:active { cursor: grabbing; }
  .sphere { fill: var(--ocean); transition: fill .4s ease; }
  .country {
    fill: var(--land-dim);
    stroke: var(--stroke);
    stroke-width: 0.6;
    vector-effect: non-scaling-stroke;
    transition: fill .25s ease, stroke .4s ease;
  }
  .country.has-radio { fill: var(--land); cursor: pointer; }
  .country.has-radio:hover { fill: var(--land-hover); }
  .country.active, .country.active:hover { fill: var(--active); }

  .ripple {
    fill: none;
    stroke: var(--active);
    stroke-width: 1.5;
    vector-effect: non-scaling-stroke;
    transform-box: fill-box;
    transform-origin: center;
    pointer-events: none;
    animation: ripple 1.2s cubic-bezier(.2,.6,.3,1) forwards;
  }
  @keyframes ripple {
    from { transform: scale(.2); opacity: .9; }
    to   { transform: scale(5);  opacity: 0; }
  }

  #map-status {
    position: fixed; inset: 0; display: grid; place-items: center;
    color: var(--muted); pointer-events: none; text-align: center; padding: 24px;
    transition: opacity .4s ease;
  }
  #map-status.done { opacity: 0; }

  #tooltip {
    position: fixed; z-index: 30; pointer-events: none;
    padding: 6px 11px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--line);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 13px; opacity: 0; transform: translate(12px, 14px);
    transition: opacity .15s ease; white-space: nowrap;
  }
  #tooltip.show { opacity: 1; }
  #tooltip small { color: var(--muted); margin-left: 6px; }

  /* ---------- Üst çubuk ---------- */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: max(16px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) 0 max(20px, env(safe-area-inset-left));
    pointer-events: none;
  }
  .topbar > * { pointer-events: auto; }
  .brand { font-family: var(--serif); font-size: 26px; letter-spacing: .1px; }
  .actions { display: flex; gap: 8px; }

  .icon-btn {
    width: 40px; height: 40px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--panel); border: 1px solid var(--line);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: transform .2s ease, background .2s ease;
  }
  .icon-btn:hover { transform: scale(1.06); }
  .icon-btn:active { transform: scale(.96); }
  .icon-btn svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .icon-btn.small { width: 32px; height: 32px; background: transparent; border-color: transparent; backdrop-filter: none; -webkit-backdrop-filter: none; color: var(--muted); }
  .icon-btn.small svg { width: 16px; height: 16px; }
  :root[data-theme="light"] .i-sun { display: none; }
  :root[data-theme="dark"] .i-moon { display: none; }

  .zoom {
    position: fixed; right: max(20px, env(safe-area-inset-right)); top: 50%; transform: translateY(-50%);
    z-index: 10; display: flex; flex-direction: column; gap: 8px;
  }
  @media (max-width: 640px) { .zoom { display: none; } }

  /* ---------- İpucu ---------- */
  .hint {
    position: fixed; left: 50%; bottom: max(28px, env(safe-area-inset-bottom));
    transform: translateX(-50%); z-index: 5;
    padding: 10px 18px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--line);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    color: var(--muted); font-size: 14px; white-space: nowrap;
    transition: opacity .35s ease, transform .35s ease;
  }
  body.playing-open .hint { opacity: 0; transform: translate(-50%, 10px); pointer-events: none; }

  /* ---------- Oynatıcı ---------- */
  .player {
    position: fixed; z-index: 20; left: 50%;
    bottom: max(14px, env(safe-area-inset-bottom));
    width: min(580px, calc(100% - 24px));
    background: var(--panel); border: 1px solid var(--line);
    backdrop-filter: blur(18px) saturate(1.2); -webkit-backdrop-filter: blur(18px) saturate(1.2);
    border-radius: 24px; box-shadow: var(--shadow);
    padding: 18px 20px 16px;
    transform: translate(-50%, calc(100% + 40px));
    transition: transform .55s cubic-bezier(.2,.8,.2,1);
  }
  body.playing-open .player { transform: translate(-50%, 0); }

  .p-head { display: flex; align-items: flex-start; gap: 12px; }
  .p-titles { flex: 1; min-width: 0; }
  #country-name { font-family: var(--serif); font-weight: 400; font-size: 34px; line-height: 1.05; margin: 0 0 6px; letter-spacing: .1px; }
  .station { margin: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { margin: 2px 0 0; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 1.4em; }

  .eq { display: inline-flex; align-items: flex-end; gap: 3px; height: 20px; margin-top: 8px; }
  .eq i { display: block; width: 3px; height: 25%; border-radius: 2px; background: var(--active); }
  .player[data-state="playing"] .eq i { animation: eq 1s ease-in-out infinite; }
  .player[data-state="playing"] .eq i:nth-child(2) { animation-delay: -.6s; animation-duration: .85s; }
  .player[data-state="playing"] .eq i:nth-child(3) { animation-delay: -.3s; animation-duration: 1.15s; }
  .player[data-state="playing"] .eq i:nth-child(4) { animation-delay: -.8s; animation-duration: .95s; }
  @keyframes eq { 0%, 100% { height: 20%; } 50% { height: 100%; } }
  .player[data-state="loading"] .eq i { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }

  .p-controls { display: flex; align-items: center; gap: 6px; margin-top: 14px; }
  .ctl { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; transition: background .2s ease, transform .2s ease; }
  .ctl:hover { background: var(--line); }
  .ctl svg { width: 20px; height: 20px; fill: currentColor; }
  .play { width: 54px; height: 54px; background: var(--active); color: var(--on-active); margin: 0 4px; }
  .play:hover { background: var(--active); transform: scale(1.06); }
  .play svg { width: 22px; height: 22px; }
  .play .i-pause { display: none; }
  .player[data-state="playing"] .play .i-pause, .player[data-state="loading"] .play .i-pause { display: block; }
  .player[data-state="playing"] .play .i-play, .player[data-state="loading"] .play .i-play { display: none; }

  .spacer { flex: 1; }
  .vol { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .vol svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  input[type="range"] { -webkit-appearance: none; appearance: none; width: 84px; height: 4px; border-radius: 4px; background: var(--line); outline-offset: 6px; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--active); border: 0; }
  input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--active); border: 0; }
  @media (max-width: 520px) { .vol { display: none; } }

  .list-toggle { display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 999px; font-size: 14px; font-weight: 500; transition: background .2s ease; }
  .list-toggle:hover { background: var(--line); }
  .list-toggle svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transition: transform .3s ease; }
  .player.open .list-toggle svg { transform: rotate(180deg); }

  .list { list-style: none; margin: 0; padding: 0; max-height: 0; overflow-y: auto; overscroll-behavior: contain; transition: max-height .4s cubic-bezier(.2,.8,.2,1), margin .4s ease; }
  .player.open .list { max-height: min(38vh, 320px); margin-top: 12px; border-top: 1px solid var(--line); padding-top: 6px; }
  .list button { width: 100%; text-align: left; padding: 10px 10px; border-radius: 12px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; transition: background .2s ease; }
  .list button:hover { background: var(--line); }
  .list .n { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list .t { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40%; }
  .list li.current button { color: var(--active); }
  .list li.current .n { font-weight: 600; }

  /* ---------- Bildirim ---------- */
  #toast {
    position: fixed; z-index: 40; left: 50%; top: max(70px, calc(env(safe-area-inset-top) + 60px));
    transform: translate(-50%, -8px); opacity: 0; pointer-events: none;
    padding: 10px 16px; border-radius: 14px; max-width: calc(100% - 32px);
    background: var(--text); color: var(--bg); font-size: 14px;
    transition: opacity .3s ease, transform .3s ease;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

<div id="stage"><svg id="map" role="img" aria-label="Dünya haritası"></svg></div>
<div id="map-status">Harita yükleniyor</div>
<div id="tooltip"></div>

<header class="topbar">
  <div class="brand">Dünya Radyosu</div>
  <div class="actions">
    <button class="icon-btn" id="shuffle" aria-label="Rastgele bir ülke seç" title="Rastgele bir ülke">
      <svg viewBox="0 0 24 24"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/></svg>
    </button>
    <button class="icon-btn" id="theme" aria-label="Temayı değiştir" title="Açık / koyu tema">
      <svg class="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<div class="zoom">
  <button class="icon-btn" id="zoom-in" aria-label="Yakınlaştır"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="icon-btn" id="zoom-out" aria-label="Uzaklaştır"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
</div>

<div class="hint">Haritada bir ülkeye dokun</div>

<section class="player" id="player" data-state="idle" aria-label="Radyo oynatıcı">
  <div class="p-head">
    <div class="p-titles">
      <h2 id="country-name"></h2>
      <p class="station" id="station-name"></p>
      <p class="meta" id="station-meta"></p>
    </div>
    <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    <button class="icon-btn small" id="close" aria-label="Kapat">
      <svg viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>

  <div class="p-controls">
    <button class="ctl" id="prev" aria-label="Önceki radyo"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9.5 12z"/></svg></button>
    <button class="ctl play" id="play" aria-label="Oynat / duraklat">
      <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
    </button>
    <button class="ctl" id="next" aria-label="Sonraki radyo"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l10.5-7z"/></svg></button>
    <span class="spacer"></span>
    <label class="vol" title="Ses">
      <svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8" aria-label="Ses seviyesi">
    </label>
    <button class="list-toggle" id="list-toggle" aria-expanded="false">
      <span id="list-label">Radyolar</span>
      <svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg>
    </button>
  </div>

  <ul class="list" id="list"></ul>
</section>

<div id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.0.1/dist/topojson-client.min.js"></script>
<script>
(() => {
  "use strict";

  /* ---------- Ayarlar ---------- */
  const WORLD_URL = "https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json";
  const API_BASES = [
    "https://de1.api.radio-browser.info",
    "https://nl1.api.radio-browser.info",
    "https://at1.api.radio-browser.info"
  ];

  // Haritadaki ülke numarası -> iki harfli ülke kodu (Radio Browser bunu kullanıyor)
  const NUM_TO_A2 = {
    "004":"AF","008":"AL","012":"DZ","024":"AO","031":"AZ","032":"AR","036":"AU","040":"AT","044":"BS","050":"BD",
    "051":"AM","056":"BE","064":"BT","068":"BO","070":"BA","072":"BW","076":"BR","084":"BZ","090":"SB","096":"BN",
    "100":"BG","104":"MM","108":"BI","112":"BY","116":"KH","120":"CM","124":"CA","140":"CF","144":"LK","148":"TD",
    "152":"CL","156":"CN","158":"TW","170":"CO","178":"CG","180":"CD","188":"CR","191":"HR","192":"CU","196":"CY",
    "203":"CZ","204":"BJ","208":"DK","214":"DO","218":"EC","222":"SV","226":"GQ","231":"ET","232":"ER","233":"EE",
    "238":"FK","242":"FJ","246":"FI","250":"FR","260":"TF","262":"DJ","266":"GA","268":"GE","270":"GM","275":"PS",
    "276":"DE","288":"GH","300":"GR","304":"GL","320":"GT","324":"GN","328":"GY","332":"HT","340":"HN","348":"HU",
    "352":"IS","356":"IN","360":"ID","364":"IR","368":"IQ","372":"IE","376":"IL","380":"IT","384":"CI","388":"JM",
    "392":"JP","398":"KZ","400":"JO","404":"KE","408":"KP","410":"KR","414":"KW","417":"KG","418":"LA","422":"LB",
    "426":"LS","428":"LV","430":"LR","434":"LY","440":"LT","442":"LU","450":"MG","454":"MW","458":"MY","466":"ML",
    "478":"MR","484":"MX","496":"MN","498":"MD","499":"ME","504":"MA","508":"MZ","512":"OM","516":"NA","524":"NP",
    "528":"NL","540":"NC","554":"NZ","558":"NI","562":"NE","566":"NG","578":"NO","586":"PK","591":"PA","598":"PG",
    "600":"PY","604":"PE","608":"PH","616":"PL","620":"PT","624":"GW","626":"TL","630":"PR","634":"QA","642":"RO",
    "643":"RU","646":"RW","682":"SA","686":"SN","688":"RS","694":"SL","703":"SK","704":"VN","705":"SI","706":"SO",
    "710":"ZA","716":"ZW","724":"ES","728":"SS","729":"SD","732":"EH","740":"SR","748":"SZ","752":"SE","756":"CH",
    "760":"SY","762":"TJ","764":"TH","768":"TG","780":"TT","784":"AE","788":"TN","792":"TR","795":"TM","800":"UG",
    "804":"UA","807":"MK","818":"EG","826":"GB","834":"TZ","840":"US","854":"BF","858":"UY","860":"UZ","862":"VE",
    "887":"YE","894":"ZM"
  };

  const $ = (s) => document.querySelector(s);
  const el = {
    stage: $("#stage"), svg: $("#map"), status: $("#map-status"), tooltip: $("#tooltip"),
    player: $("#player"), country: $("#country-name"), station: $("#station-name"), meta: $("#station-meta"),
    list: $("#list"), listToggle: $("#list-toggle"), listLabel: $("#list-label"),
    play: $("#play"), prev: $("#prev"), next: $("#next"), close: $("#close"), volume: $("#volume"),
    shuffle: $("#shuffle"), theme: $("#theme"), toast: $("#toast"),
    zoomIn: $("#zoom-in"), zoomOut: $("#zoom-out")
  };

  /* ---------- Tema ---------- */
  const root = document.documentElement;
  let savedTheme = null;
  try { savedTheme = localStorage.getItem("theme"); } catch (e) {}
  root.dataset.theme = savedTheme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  el.theme.addEventListener("click", () => {
    const t = root.dataset.theme === "dark" ? "light" : "dark";
    root.dataset.theme = t;
    try { localStorage.setItem("theme", t); } catch (e) {}
  });

  /* ---------- Yardımcılar ---------- */
  let toastTimer;
  function toast(msg) {
    el.toast.textContent = msg;
    el.toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.toast.classList.remove("show"), 3400);
  }

  let apiIndex = 0;
  async function api(path) {
    let lastErr;
    for (let i = 0; i < API_BASES.length; i++) {
      const at = (apiIndex + i) % API_BASES.length;
      try {
        const r = await fetch(API_BASES[at] + path);
        if (!r.ok) throw new Error("HTTP " + r.status);
        apiIndex = at;
        return await r.json();
      } catch (e) { lastErr = e; }
    }
    throw lastErr;
  }

  let regionNames = null;
  try { regionNames = new Intl.DisplayNames(["tr"], { type: "region" }); } catch (e) {}
  function countryLabel(f) {
    try {
      const n = regionNames && regionNames.of(f.code);
      if (n && n !== f.code) return n;
    } catch (e) {}
    return f.properties.name;
  }

  /* ---------- Oynatıcı durumu ---------- */
  const audio = new Audio();
  audio.preload = "none";
  audio.volume = parseFloat(el.volume.value);

  let stations = [];
  let current = 0;
  let state = "idle"; // idle | loading | playing | paused | error
  let attempts = 0;
  let token = 0;
  let paths; // d3 seçimi

  function setState(s) {
    state = s;
    el.player.dataset.state = s;
    updateMeta();
  }

  function updateMeta() {
    const st = stations[current];
    if (state === "loading") { el.meta.textContent = "Bağlanıyor"; return; }
    if (state === "paused")  { el.meta.textContent = "Duraklatıldı"; return; }
    if (state === "error")   { el.meta.textContent = "Açılamadı"; return; }
    if (!st) { el.meta.textContent = ""; return; }
    const tags = (st.tags || "").split(",").map(t => t.trim()).filter(Boolean).slice(0, 3).join(", ");
    el.meta.textContent = tags;
  }

  function showPlayer(open) { document.body.classList.toggle("playing-open", open); }

  function renderList() {
    el.list.textContent = "";
    stations.forEach((s, i) => {
      const li = document.createElement("li");
      if (i === current) li.className = "current";
      const b = document.createElement("button");
      const n = document.createElement("span"); n.className = "n"; n.textContent = s.name.trim();
      const t = document.createElement("span"); t.className = "t";
      t.textContent = (s.tags || "").split(",").map(x => x.trim()).filter(Boolean)[0] || "";
      b.append(n, t);
      b.addEventListener("click", () => { attempts = 0; playStation(i); });
      li.append(b);
      el.list.append(li);
    });
    el.listLabel.textContent = stations.length ? "Radyolar (" + stations.length + ")" : "Radyolar";
  }

  function markCurrent() {
    [...el.list.children].forEach((li, i) => li.classList.toggle("current", i === current));
    const cur = el.list.children[current];
    if (cur && el.player.classList.contains("open")) cur.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }

  async function fetchStations(code) {
    const https = location.protocol === "https:" ? "&is_https=true" : "";
    const data = await api(
      "/json/stations/search?countrycode=" + encodeURIComponent(code) +
      "&hidebroken=true&order=clickcount&reverse=true&limit=60" + https
    );
    const seen = new Set();
    const out = [];
    for (const s of data) {
      const url = s.url_resolved || s.url;
      const key = (s.name || "").trim().toLowerCase();
      if (!url || !key || seen.has(key)) continue;
      seen.add(key);
      out.push(s);
      if (out.length >= 30) break;
    }
    return out;
  }

  function playStation(i) {
    current = i;
    const s = stations[i];
    el.station.textContent = s.name.trim();
    markCurrent();
    setState("loading");
    audio.src = s.url_resolved || s.url;
    const p = audio.play();
    if (p && p.catch) {
      p.catch((err) => {
        if (err.name === "AbortError") return;
        if (err.name === "NotAllowedError") { setState("paused"); toast("Başlatmak için oynat düğmesine bas."); return; }
        onFail();
      });
    }
    api("/json/url/" + s.stationuuid).catch(() => {}); // radyo tıklama sayacı (API nezaketi)
    if ("mediaSession" in navigator) {
      try {
        navigator.mediaSession.metadata = new MediaMetadata({ title: s.name.trim(), artist: el.country.textContent, album: "Dünya Radyosu" });
      } catch (e) {}
    }
  }

  function onFail() {
    if (state === "paused" || state === "idle") return;
    if (attempts < 4 && stations.length > 1) {
      attempts++;
      toast("Bu yayın açılmadı, sıradaki deneniyor.");
      playStation((current + 1) % stations.length);
    } else {
      setState("error");
      toast("Yayın açılamadı. Listeden başka bir radyo seç.");
    }
  }

  audio.addEventListener("playing", () => { attempts = 0; setState("playing"); });
  audio.addEventListener("waiting", () => { if (state === "playing") setState("loading"); });
  audio.addEventListener("error", onFail);

  function step(dir) {
    if (!stations.length) return;
    attempts = 0;
    playStation((current + dir + stations.length) % stations.length);
  }

  el.play.addEventListener("click", () => {
    if (!stations.length) return;
    if (state === "playing" || state === "loading") { audio.pause(); setState("paused"); }
    else { attempts = 0; playStation(current); } // canlı yayına yeniden bağlan
  });
  el.prev.addEventListener("click", () => step(-1));
  el.next.addEventListener("click", () => step(1));
  el.volume.addEventListener("input", () => { audio.volume = parseFloat(el.volume.value); });
  el.listToggle.addEventListener("click", () => {
    const open = el.player.classList.toggle("open");
    el.listToggle.setAttribute("aria-expanded", String(open));
    if (open) markCurrent();
  });
  el.close.addEventListener("click", () => {
    token++;
    audio.pause();
    setState("idle");
    stations = [];
    showPlayer(false);
    el.player.classList.remove("open");
    paths && paths.classed("active", false);
  });

  if ("mediaSession" in navigator) {
    try {
      navigator.mediaSession.setActionHandler("play", () => el.play.click());
      navigator.mediaSession.setActionHandler("pause", () => el.play.click());
      navigator.mediaSession.setActionHandler("previoustrack", () => step(-1));
      navigator.mediaSession.setActionHandler("nexttrack", () => step(1));
    } catch (e) {}
  }

  /* ---------- Harita ---------- */
  async function init() {
    let world, codes = null;
    try {
      [world, codes] = await Promise.all([
        d3.json(WORLD_URL),
        api("/json/countrycodes").catch(() => null)
      ]);
    } catch (e) {
      el.status.textContent = "Harita yüklenemedi. İnternet bağlantını kontrol edip sayfayı yenile.";
      return;
    }

    const available = codes ? new Set(codes.filter(c => c.stationcount > 0).map(c => String(c.name).toUpperCase())) : null;
    const hasRadio = (code) => !!code && (!available || available.has(code));

    const features = topojson.feature(world, world.objects.countries).features
      .filter(f => f.id !== "010") // Antarktika
      .map(f => {
        f.code = NUM_TO_A2[f.id] || (f.properties.name === "Kosovo" ? "XK" : null);
        return f;
      });

    const svg = d3.select(el.svg);
    const view = svg.append("g");
    const sphere = view.append("path").attr("class", "sphere");
    const gCountries = view.append("g");
    const gFx = view.append("g");

    const projection = d3.geoNaturalEarth1();
    const path = d3.geoPath(projection);

    paths = gCountries.selectAll("path").data(features).join("path")
      .attr("class", d => "country" + (hasRadio(d.code) ? " has-radio" : ""))
      .on("pointermove", (e, d) => {
        if (e.pointerType !== "mouse") return;
        el.tooltip.textContent = countryLabel(d);
        if (!hasRadio(d.code)) {
          const small = document.createElement("small");
          small.textContent = "radyo yok";
          el.tooltip.append(small);
        }
        el.tooltip.style.left = e.clientX + "px";
        el.tooltip.style.top = e.clientY + "px";
        el.tooltip.classList.add("show");
      })
      .on("pointerleave", () => el.tooltip.classList.remove("show"))
      .on("click", (e, d) => {
        if (!hasRadio(d.code)) { toast(countryLabel(d) + " için radyo bulunamadı."); return; }
        selectCountry(d, d3.pointer(e, view.node()));
      });

    const zoom = d3.zoom()
      .scaleExtent([1, 12])
      .on("zoom", (e) => view.attr("transform", e.transform));
    svg.call(zoom).on("dblclick.zoom", null);

    function layout() {
      const { width: w, height: h } = el.stage.getBoundingClientRect();
      svg.attr("viewBox", "0 0 " + w + " " + h);
      projection.fitExtent([[16, 64], [w - 16, h - 130]], { type: "Sphere" });
      sphere.attr("d", path({ type: "Sphere" }));
      paths.attr("d", path);
      zoom.extent([[0, 0], [w, h]]).translateExtent([[0, 0], [w, h]]);
    }
    layout();
    el.status.classList.add("done");

    let resizeTimer;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => { svg.call(zoom.transform, d3.zoomIdentity); layout(); }, 120);
    });

    el.zoomIn.addEventListener("click", () => svg.transition().duration(350).call(zoom.scaleBy, 1.7));
    el.zoomOut.addEventListener("click", () => svg.transition().duration(350).call(zoom.scaleBy, 1 / 1.7));

    function ripple(pt) {
      [0, 180].forEach((delay) => {
        const c = gFx.append("circle")
          .attr("class", "ripple").attr("cx", pt[0]).attr("cy", pt[1]).attr("r", 8)
          .style("animation-delay", delay + "ms");
        c.on("animationend", () => c.remove());
      });
    }

    function mainCentroid(f) {
      if (f.geometry.type === "Polygon") return path.centroid(f);
      let best = null, area = -1;
      f.geometry.coordinates.forEach((coords) => {
        const poly = { type: "Polygon", coordinates: coords };
        const a = d3.geoArea(poly);
        if (a > area) { area = a; best = poly; }
      });
      return path.centroid(best);
    }

    async function selectCountry(f, pt) {
      const my = ++token;
      paths.classed("active", d => d.code === f.code);
      ripple(pt || mainCentroid(f));

      audio.pause();
      stations = [];
      current = 0;
      attempts = 0;
      el.country.textContent = countryLabel(f);
      el.station.textContent = "Radyolar aranıyor";
      renderList();
      setState("loading");
      showPlayer(true);

      let list;
      try {
        list = await fetchStations(f.code);
      } catch (e) {
        if (my !== token) return;
        el.station.textContent = "Radyo listesi alınamadı";
        setState("error");
        toast("Radyo listesi alınamadı. İnternet bağlantını kontrol et.");
        return;
      }
      if (my !== token) return;

      if (!list.length) {
        el.station.textContent = "Çalışan radyo bulunamadı";
        setState("error");
        return;
      }
      stations = list;
      renderList();
      playStation(0);
    }

    el.shuffle.addEventListener("click", () => {
      const pool = features.filter(f => hasRadio(f.code) && (!paths.filter(d => d === f).classed("active")));
      const f = pool[Math.floor(Math.random() * pool.length)];
      if (f) selectCountry(f);
    });
  }

  init();
})();
</script>
</body>
</html>
